version: '3'

services:
  mongodb:
    image: mongo:4.4
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo-data:/data/db

  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    depends_on:
      - mongodb

  notes-service:
    build: ./notes-service
    ports:
      - "3002:3002"
    depends_on:
      - mongodb
      - auth-service

volumes:
  mongo-data:
